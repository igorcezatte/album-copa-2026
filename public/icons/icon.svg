<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111c33"/>
      <stop offset="1" stop-color="#070b16"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe072"/>
      <stop offset="0.5" stop-color="#f5c42e"/>
      <stop offset="1" stop-color="#cf9c12"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0" stop-color="#f5c42e" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#f5c42e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <g transform="translate(256,248)">
    <!-- handles -->
    <path d="M-72,-58 Q-122,-58 -122,-12 Q-122,34 -68,36" fill="none" stroke="url(#gold)" stroke-width="20" stroke-linecap="round"/>
    <path d="M72,-58 Q122,-58 122,-12 Q122,34 68,36" fill="none" stroke="url(#gold)" stroke-width="20" stroke-linecap="round"/>
    <!-- cup body -->
    <path d="M-74,-80 L74,-80 L67,32 Q61,90 0,108 Q-61,90 -67,32 Z" fill="url(#gold)"/>
    <!-- stem + base -->
    <rect x="-15" y="108" width="30" height="30" fill="url(#gold)"/>
    <rect x="-56" y="136" width="112" height="20" rx="10" fill="url(#gold)"/>
    <!-- shine highlight -->
    <path d="M-52,-68 L-30,-68 L-46,26 L-64,24 Z" fill="#ffffff" opacity="0.16"/>
    <!-- 26 -->
    <text x="0" y="10" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="900" fill="#0a0f1c">26</text>
  </g>
</svg>
